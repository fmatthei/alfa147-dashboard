name: Recompute digest files

# Rebuilds tuesday.txt and digest.json from state.json with the real current date,
# so the Tuesday Claude task never reads a stale file.
# Runs every morning, and right away whenever state.json or the script changes.
on:
  schedule:
    # Two times as a safety net: GitHub can delay or skip scheduled runs.
    - cron: "47 6 * * *"    # ~03:47 Santiago (summer)
    - cron: "23 11 * * *"   # ~08:23 Santiago (summer), before the Tuesday 10:00 task
  push:
    branches: [main]
    paths: [state.json, build_digest.py, status.py, .github/workflows/recompute.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recompute
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    env:
      TZ: America/Santiago
    steps:
      - uses: actions/checkout@v4

      - name: Validate state.json
        run: jq -e '.maintenance_items | length > 0' state.json > /dev/null

      - name: Rebuild and commit
        run: |
          python3 build_digest.py
          python3 status.py . ok
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tuesday.txt digest.json digest status.txt
          git commit -m "Digest refresh $(date +%F)" && git pull --rebase -q && git push

      - name: Record the failure in status.txt
        # Runs only if a step above failed, so the next email can say so.
        if: ${{ failure() }}
        run: |
          git reset -q --hard
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase || true
          python3 status.py . FAILED "digest build failed, GitHub run ${{ github.run_id }}"
          git add status.txt && git commit -m "Status: digest build failed $(date +%F)" && git push
